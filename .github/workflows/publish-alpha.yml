name: Publish alpha release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[release audit-alpha01]')
    name: Build and publish v0.2.1-alpha01
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify and build APK
        run: gradle clean testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Prepare release asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Norvexa-Flow-0.2.1-alpha01.apk
          sha256sum Norvexa-Flow-0.2.1-alpha01.apk > Norvexa-Flow-0.2.1-alpha01.sha256
          cat > release-notes.md <<'NOTES'
          Norvexa Flow 0.2.1 alpha01 — audit and financial-integrity release.

          Исправлено:
          - получение ожидаемой оплаты теперь создаёт реальный доход и зачисляет деньги в выбранный кошелёк;
          - оплата планового расхода создаёт фактический расход и списывает деньги с выбранного кошелька;
          - recurring-расходы переносятся на следующий период и учитываются в прогнозе;
          - просроченные обязательства больше не выпадают из cash-flow;
          - плановый налоговый резерв рассчитывается по доходам текущего месяца и влияет на доступные деньги;
          - смена базовой валюты после onboarding заблокирована до появления безопасного мастера пересчёта;
          - мультивалютные суммы используют ISO fraction digits, включая JPY;
          - добавлена Room migration 1 -> 2 без destructive fallback;
          - автоматические settlement-транзакции связаны с источником и защищены от отдельного удаления;
          - backup `.nvxflow` обновлён до v2: сохраняет финансовые настройки и settlement metadata, валидирует входные данные и ограничивает размер;
          - legacy backup v1 остаётся читаемым с проверкой базовой валюты;
          - CSV больше не использует Double для денежных значений и защищён от spreadsheet formula injection;
          - PDF-отчёт стал многостраничным;
          - разрешение уведомлений запрашивается после onboarding;
          - исправлены mixed-currency суммы клиентов и минимальные touch targets;
          - добавлены regression-тесты на найденные ошибки.

          Известное ограничение alpha: локальная Room DB и `.nvxflow` backups пока не зашифрованы at rest. Это будет отдельная data-preserving security migration.
          NOTES

      - name: Upload exact release build
        uses: actions/upload-artifact@v4
        with:
          name: Norvexa-Flow-0.2.1-alpha01-release
          path: |
            Norvexa-Flow-0.2.1-alpha01.apk
            Norvexa-Flow-0.2.1-alpha01.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.1-alpha01 \
            Norvexa-Flow-0.2.1-alpha01.apk \
            Norvexa-Flow-0.2.1-alpha01.sha256 \
            --target "$GITHUB_SHA" \
            --title "Norvexa Flow 0.2.1 alpha01" \
            --notes-file release-notes.md \
            --prerelease
