name: Publish alpha release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[release ui-alpha01]')
    name: Build and publish v0.2.0-alpha01
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify and build APK
        run: gradle clean testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Prepare release asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Norvexa-Flow-0.2.0-alpha01.apk
          sha256sum Norvexa-Flow-0.2.0-alpha01.apk > Norvexa-Flow-0.2.0-alpha01.sha256
          cat > release-notes.md <<'NOTES'
          Norvexa Flow 0.2.0 alpha01 — крупный UI/UX редизайн.

          Основные изменения:
          - новая дизайн-система в духе Apple Human Interface Guidelines;
          - iOS-подобная светлая и тёмная палитра;
          - крупная типографика и более ясная визуальная иерархия;
          - переработанный финансовый обзор;
          - новая нижняя навигация и меню добавления;
          - компактные карточки операций, клиентов и будущих платежей;
          - полностью переработанный раздел настроек без дублирующих кнопок;
          - новый onboarding;
          - единые радиусы, отступы, состояния, иконки и группировка данных;
          - сохранён весь функционал версии 0.1.0.

          Это debug-подписанная тестовая сборка. При обновлении с предыдущей alpha Android может потребовать удалить старую debug-сборку из-за смены временного debug-ключа CI.
          NOTES

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0-alpha01 \
            Norvexa-Flow-0.2.0-alpha01.apk \
            Norvexa-Flow-0.2.0-alpha01.sha256 \
            --target "$GITHUB_SHA" \
            --title "Norvexa Flow 0.2.0 alpha01" \
            --notes-file release-notes.md \
            --prerelease
